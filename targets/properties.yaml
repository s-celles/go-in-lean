  - id: BITS-DIV-PANIC
    package: math/bits
    function: Div64 (generic algorithm)
    go_source: "src/math/bits/bits.go:518-570"
    doc: "Div64 panics for y == 0 (division by zero) or y <= hi (quotient overflow)."
    preconditions: none
    postcondition: "divideError iff y = 0; overflowError iff y ≠ 0 ∧ y ≤ hi; otherwise returns ok"
    lean_statement: "∀ h hi lo y, (y = 0 → divGeneric = error divideError) ∧ (y ≠ 0 → y ≤ hi → error overflowError) ∧ (y ≠ 0 → hi < y → ∃ r, ok r)"
    lean_theorem: [Go.Bits.Properties.divGeneric_divide, Go.Bits.Properties.divGeneric_overflow, Go.Bits.Properties.divGeneric_ok]
    oracle: "Go doc comment; TestDiv64Panics checks the runtime error values"
    ambiguity_risk: low
    complexity: low
    trust: kernel
    status: proved_in_model
    go_tests: [TestDiv64Panics]
    history:
      - {date: 2026-11-01, status: proved_in_model, note: "proved for every half-width h (kernel only)"}
