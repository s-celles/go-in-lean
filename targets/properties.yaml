#
# Field notes
#   go_source      file:line range in go1.25.5 (commit c6069d2a943b71b0a90d91fc1ac93cb9c1634dcc)
#   preconditions  from the Go doc comment; `none` means total
#   lean_statement theorem statement in prose; lean_theorem = fully qualified Lean names
#   oracle         independent reference used both in Lean (BitSpec) and in Go tests
#   trust          audit tier: kernel | bv_decide (adds a per-theorem native-evaluation axiom)
#   status         proved_in_model | counterexample_in_model | model_mismatch |
#                  specification_ambiguity | go_discrepancy_reproduced | known_issue | inconclusive
#   NOTE: proved_in_model is a statement about the Lean model. The model is
#   validated against Go only by scripts/check.sh step 6 (differential vectors)
#   and the go_tests listed; it is not a proof about the Go binary.
