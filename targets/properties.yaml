  - id: BITS-ADD-64
    package: math/bits
    function: Add64
    go_source: "src/math/bits/bits.go:386-394"
    doc: "Add64 returns the sum with carry of x, y and carry: sum = x + y + carry. The carry input must be 0 or 1; otherwise the behavior is undefined. The carryOut output is guaranteed to be 0 or 1."
    preconditions: "carry ∈ {0,1}"
    postcondition: "carryOut·2^64 + sum = x + y + carry (as a 128-bit integer); carryOut ≤ 1 unconditionally"
    lean_statement: "∀ x y c, c = 0 ∨ c = 1 → (carryOut <<< 64 ||| sum : BitVec 128) = zext x + zext y + zext c"
    lean_theorem: [Go.Bits.Properties.Add64_spec, Go.Bits.Properties.Add64_carryOut_le_one]
    oracle: "128-bit BitVec arithmetic; Go math/big"
    ambiguity_risk: "medium: without the precondition the formula is wrong for carry ≥ 2 (golang/go#54255, closed not-a-bug)"
    complexity: low
    trust: bv_decide
    status: proved_in_model
    go_tests: [TestAddSubMulDivBoundary, FuzzAddSubMulDiv]
    history:
      - {date: 2026-11-01, status: proved_in_model}
